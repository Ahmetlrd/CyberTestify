# CyberTestify — PRODUCTION tek-dosya orkestrasyonu.
#
# `docker compose -f docker-compose.prod.yml up -d` TEK komutla hem bizim
# servislerimizi hem de PentAGI'nin kendi yiginini (patch'li image ile) ayaga
# kaldirir. PentAGI'nin compose'u `include` ile katilir — boylece upstream
# dosyayi DEGISTIRMEDEN (patch/registry akisi bozulmadan) ve onun goreli-yol
# mount'lari (../pentagi/ dizinine gore) korunarak birlesir.
#
# GUVENLIK: PentAGI ve tum ic servisler DISARIYA ACILMAZ (yalniz 127.0.0.1'e
# bagli veya hic yayinlanmamis). Disariya yalniz Caddy (80/443) cikar.
# Kapsam kilidi: egress-proxy `cybertestify` + `pentagi-egress` aglarinda;
# api/worker ona `service_healthy` ile baglidir (proxy'siz kalkmaz).

name: cybertestify

include:
  - path: ../pentagi/docker-compose.yml
    env_file: ../pentagi/.env

services:
  cybertestify-db:
    image: postgres:16-alpine
    container_name: cybertestify-db
    restart: always
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: ${CYBER_DB_PASSWORD}
      POSTGRES_DB: cybertestify
    volumes:
      - cybertestify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cybertestify"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cybertestify]

  egress-proxy:
    build: ./backend
    command: ["npx", "tsx", "src/egress-proxy/server.ts"]
    container_name: cybertestify-egress-proxy
    restart: always
    env_file: ./.env
    environment:
      BACKEND_INTERNAL_URL: "http://api:4000"
      EGRESS_PROXY_URL: "http://localhost:8899"
    # cybertestify (internet + backend) + pentagi-egress (PentAGI terminal'leri) +
    # pentagi-network: PentAGI ORCHESTRATOR'unun (pentagi container) kendi LLM
    # cagrilarini da PROXY_URL=egress-proxy uzerinden yapabilmesi icin — aksi halde
    # 'lookup egress-proxy: server misbehaving' ile createFlow patlar.
    networks: [cybertestify, pentagi-egress, pentagi-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8899/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build: ./backend
    command: ["npx", "tsx", "src/server.ts"]
    container_name: cybertestify-api
    restart: always
    env_file: ./.env
    depends_on:
      egress-proxy:
        condition: service_healthy   # proxy saglikli olmadan API kalkmaz
      cybertestify-db:
        condition: service_healthy
    # pentagi-network: PentAGI GraphQL'e (http://pentagi:8443) ulasmak icin.
    networks: [cybertestify, pentagi-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build: ./backend
    command: ["npx", "tsx", "src/worker.ts"]
    container_name: cybertestify-worker
    restart: always
    env_file: ./.env
    depends_on:
      egress-proxy:
        condition: service_healthy
      cybertestify-db:
        condition: service_healthy
    networks: [cybertestify, pentagi-network]

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* build-time'da gomulur; tarayici bu URL'e gider.
        NEXT_PUBLIC_API_URL: "https://api.cybertestify.com"
        # GA4 Measurement ID — .env'den (bossa gtag yuklenmez). Degisince frontend REBUILD gerekir.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: "${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}"
        # Microsoft Clarity project ID — .env'den (bossa yuklenmez; yalniz onay sonrasi). REBUILD gerekir.
        NEXT_PUBLIC_CLARITY_PROJECT_ID: "${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}"
        # Cloudflare Turnstile SITE key — .env'den (bossa component TEST key kullanir). Degisince REBUILD.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    container_name: cybertestify-frontend
    restart: always
    # SSR meta icin YALNIZ bu degisken .env'den gecirilir (secret sizmasin diye env_file DEGIL).
    # Bossa layout meta tag'i render etmez. Degistiginde `docker compose up -d frontend` yeter.
    environment:
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
    networks: [cybertestify]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    container_name: cybertestify-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, frontend]
    networks: [cybertestify]

volumes:
  cybertestify-db-data:
  caddy-data:
  caddy-config:

networks:
  cybertestify:
    name: cybertestify
  # PentAGI terminal container'larinin izole egress agi (once olusturulur:
  # docker network create pentagi-egress). egress-proxy buraya da baglidir.
  pentagi-egress:
    external: true
  # NOT: `pentagi-network` PentAGI compose'undan `include` ile gelir; burada
  # yeniden TANIMLANMAZ (api/worker yalnizca referans verir).
